name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.1'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/check_secrets.py .
      - run: feedback-study verify
      - run: feedback-study reproduce --output outputs/ci
